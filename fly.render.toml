# The browser, on a machine that holds nothing worth stealing.
#
# Deploy with:  flyctl deploy -c fly.render.toml -a scrapewright-render
#
# Deliberately missing, and each absence is the point:
#
#   no [mounts]      -- no volume, so no database and no recipes
#   no public IP      -- no public address at all. The only address this
#                        app has is a Flycast one, routable from inside
#                        the organisation and nowhere else. Deploy with
#                        --no-public-ips so a redeploy never grants one.
#   no secrets        -- no Stripe key, no model key, no bucket credentials.
#                        The only one it has is RENDER_TOKEN, which grants
#                        nothing but the right to ask it to render a page.
#
# An escape from Chromium here lands on a container that can fetch web
# pages. Next door to the API it would have landed on the business.

app = "scrapewright-render"
primary_region = "cdg"

[build]
  [build.args]
    WITH_JS = "1"

[experimental]
  # The same image as the API, told to be only the browser.
  #
  # `0.0.0.0`, because the proxy reaches an instance over IPv4 and
  # asyncio's IPv6 sockets are v6-only, so there is no one host string
  # that serves both. Everything arrives through the proxy, so IPv4 is the
  # one that matters; calling the machine directly at
  # scrapewright-render.internal (6PN, IPv6) will not work, and should
  # not be used -- see the Flycast note below.
  cmd = ["scrapewright", "render-service", "--host", "0.0.0.0", "--port", "8080"]

[env]
  SCRAPEWRIGHT_OBEY_ROBOTS = "1"
  HEALTHCHECK_PORT = "8080"
  # One render at a time, as next door. Raise it with the memory.
  BROWSER_SLOTS = "1"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # What makes this private is the absence of a public IP address, not the
  # absence of this block. The proxy listens on 8080 of whatever addresses
  # the app has, and the app has exactly one: a Flycast address, routable
  # only from inside the organisation. Without the port published the proxy
  # would not listen at all -- and then it would never see a request, never
  # wake a stopped machine, and the renderer would stop once and stay
  # stopped. Going straight to `.internal` instead bypasses the proxy, and
  # a stopped machine never wakes: that bypass is what makes auto-stop a
  # trap rather than a saving.
  [[services.ports]]
    port = 8080

  [services.concurrency]
    type = "requests"
    soft_limit = 1
    hard_limit = 2

[[vm]]
  size = "shared-cpu-1x"
  # Chromium peaks a few hundred megabytes; this is one browser plus room
  # for the page. Nothing else runs here.
  memory = "1024mb"

# Stopping between bursts is a security property as much as a cost one: a
# compromised renderer does not outlive the traffic that compromised it.
