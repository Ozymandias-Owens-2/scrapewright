[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapewright"
version = "0.2.0"
description = "Give it a store URL — it detects the platform and, for custom sites, synthesizes a reusable scraper once via an LLM, then replays it for free."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fedor Dyatlov" }]
keywords = ["scraping", "ecommerce", "llm", "agent", "shopify", "woocommerce", "extraction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "requests>=2.28",
  "beautifulsoup4>=4.11",
  "pydantic>=2.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=7.0", "anthropic>=0.40", "openpyxl>=3.1"]

[project.scripts]
scrapewright = "scrapewright.cli:main"

[project.urls]
Homepage = "https://github.com/Ozymandias-Owens-2/scrapewright"
Issues = "https://github.com/Ozymandias-Owens-2/scrapewright/issues"

[tool.hatch.build.targets.wheel]
packages = ["scrapewright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
