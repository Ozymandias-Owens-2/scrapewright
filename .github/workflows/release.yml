# Publishing to PyPI from a long-lived token kept on one laptop is the
# weakest link in a one-maintainer project: the token outlives the laptop,
# the laptop outlives attention. Trusted Publishing swaps it for a short
# OIDC credential minted per run, so there is no secret to leak.
#
# PyPI needs to be told once, under the project's Publishing settings:
#   owner  Ozymandias-Owens-2   repository  scrapewright
#   workflow  release.yml       environment  pypi
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: The tag must match the version in the package
        run: |
          VERSION=$(python -c "import re,pathlib; print(re.search(r'\"([^\"]+)\"', pathlib.Path('scrapewright/_version.py').read_text()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG does not match __version__ $VERSION"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # the whole point: OIDC instead of a token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
