# Fly.io deployment. Deliberately one machine, not a herd.
#
# The credit ledger is SQLite on a mounted volume, and SQLite has exactly one
# writer. Two machines would mean two ledgers diverging, each certain it knew
# a customer's balance. Horizontal scale here needs Postgres first, so the
# config pins a single machine and says why.

app = "scrapewright-api"
primary_region = "cdg"        # Fly has no Madrid; Paris is the closest edge

[build]
  dockerfile = "Dockerfile"

  [build.args]
    # Ship Chromium. Without it the `js=true` path and the `renders` meter are
    # dead in production -- the library can read client-rendered shops and the
    # hosted service could not. It costs a much larger image and more memory.
    WITH_JS = "1"

[env]
  # The Dockerfile sets this too; repeated here because this file is the thing
  # people read when they wonder where the data lives.
  SCRAPEWRIGHT_DB = "/data/service.db"
  # On the volume, not in the container: a recipe thrown away on
  # deploy costs real money to work out again.
  SCRAPEWRIGHT_CACHE = "/data/recipes.json"
  SCRAPEWRIGHT_OBEY_ROBOTS = "1"
  # Two renders at a time, which is what scrapewright-render can actually
  # do: two machines, one browser each. One was the old limit from when
  # Chromium ran in this container and it throttled both of those machines
  # down to a single page at a time -- a forty-row sheet spent 246 of its
  # 269 seconds on five renders that could have overlapped.
  #
  # Four was too many, and the way it failed is worth remembering: this
  # semaphore let four through, the renderer answered 503 to the two it had
  # no browser for, and the pipeline read "no HTML" as "this page is
  # empty". Three rows that had worked the day before came back "Nothing
  # found", and two sites paid for a second compilation because the first
  # one never got a page to read. A ceiling above the real capacity is not
  # a ceiling; it just moves the failure somewhere it reads as a bug in the
  # page. Raise this when the render app grows, not before.
  # The local fallback stays at one whatever this says (see browser_pool).
  BROWSER_SLOTS = "2"
  # Long enough to queue behind a render rather than be refused: a batch of
  # four arrives at once and a render takes twenty to thirty seconds.
  BROWSER_WAIT_SECONDS = "60"
  # Twice the add-on's batch size, not equal to it. Matching it exactly left
  # no headroom at all: the add-on sends four at once, so a second sheet, a
  # continuation trigger overlapping its parent, or a manual refresh during
  # the nightly run put a fifth request on the same key and the tail of the
  # batch came back 429 -- "Limit reached" written into cells whose pages
  # were fine. Renders are capped separately by BROWSER_SLOTS, so this
  # number does not let more browsers run; it only stops the client
  # tripping over itself.
  MAX_IN_FLIGHT_PER_KEY = "8"
  # Where Stripe sends a customer back after paying, and what the registry
  # listing points at.
  PUBLIC_BASE_URL = "https://scrapewright.app"

[mounts]
  source = "scrapewright_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  # Never scale past one. See the note at the top.
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

# Stripe retries a failed webhook, but a cold start that times out still delays
# a customer's credits, so the machine stays warm and is checked often.
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  # 1GB because of Chromium: a headless render of a heavy shop page will not fit
  # in 512MB, and the failure mode is the machine being killed mid-crawl rather
  # than an error a caller can read.
  # Raised from 1024 after a Chromium OOM took the service down. One
  # browser at a time now (BROWSER_SLOTS), so this is headroom rather than
  # the fix: a render peaks a few hundred megabytes and the kernel killing
  # the Playwright driver poisons every later request.
  memory = "2048mb"
